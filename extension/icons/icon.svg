<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="geometricPrecision">
  <!-- Background: #1e44a8 (terminal blue-sea, matches CSS card token) -->
  <rect width="128" height="128" fill="#1e44a8"/>
  <!-- Tab card, centered: bbox 16,32 → 112,96 -->
  <rect x="16" y="32" width="96" height="64" rx="10" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Prompt > -->
  <path d="M 36 54 L 56 64 L 36 74" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore cursor -->
  <rect x="62" y="75" width="28" height="4" fill="#ffffff" rx="1"/>
</svg>