<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="geometricPrecision">
  <!-- Transparent background -->
  <!-- Centered rounded tab: 88x68 means bbox 20,30 to 108,98 → center (64,64) -->
  <rect x="20" y="30" width="88" height="68" rx="8" fill="none" stroke="#1a170f" stroke-width="4"/>
  <!-- Prompt > -->
  <path d="M 36 54 L 56 64 L 36 74" fill="none" stroke="#3a3530" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Underscore cursor -->
  <rect x="62" y="70" width="28" height="6" fill="#3a3530" rx="1"/>
</svg>
