<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Terminal Dark palette: background #1a170f, foreground #eceae5, accent #eec35e -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="#1a170f"/>
  <!-- Three stacked tab outlines (back to front) -->
  <rect x="34" y="40" width="62" height="44" rx="6" fill="none" stroke="#5c4a2a" stroke-width="3"/>
  <rect x="28" y="46" width="62" height="44" rx="6" fill="none" stroke="#7a6440" stroke-width="3"/>
  <rect x="22" y="52" width="62" height="44" rx="6" fill="none" stroke="#eceae5" stroke-width="3"/>
  <!-- Cursor underline (active tab indicator) -->
  <rect x="22" y="100" width="62" height="8" fill="#eec35e" rx="2"/>
</svg>
