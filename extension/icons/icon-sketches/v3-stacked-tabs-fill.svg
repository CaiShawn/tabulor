<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" shape-rendering="geometricPrecision">
  <!-- Terminal Dark palette: background #1a170f, foreground #eceae5, accent #eec35e -->
  <!-- Rounded square base -->
  <rect x="2" y="2" width="124" height="124" rx="24" fill="#1a170f"/>
  <!-- Three stacked tab outlines (back to front), each with fill so 16px reads as solid blocks -->
  <rect x="36" y="38" width="62" height="44" rx="6" fill="#3a2f1c" stroke="#5c4a2a" stroke-width="2"/>
  <rect x="30" y="44" width="62" height="44" rx="6" fill="#5c4a2a" stroke="#7a6440" stroke-width="2"/>
  <rect x="24" y="50" width="62" height="44" rx="6" fill="#eceae5"/>
  <!-- Cursor underline (active tab indicator) -->
  <rect x="24" y="98" width="62" height="8" fill="#eec35e" rx="2"/>
</svg>
